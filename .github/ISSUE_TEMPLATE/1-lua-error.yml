name: Lua error
description: You got a BugSack report or the default Lua error pop-up mentioning Chuckwagon.
title: "[Error] "
labels: ["bug", "lua-error"]
body:
  - type: textarea
    id: error
    attributes:
      label: Error text
      description: Paste the whole error from BugSack (or the default error pop-up), including the stack trace and the "Locals" section if shown.
      render: text
    validations:
      required: true
  - type: textarea
    id: doing
    attributes:
      label: What were you doing?
      description: E.g. logging in, looting, clicking a CW macro, entering or leaving combat, changing a setting in the options.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Chuckwagon version
      description: Shown in the AddOns list or the CurseForge app.
    validations:
      required: true
  - type: input
    id: character
    attributes:
      label: Class / level
      placeholder: Rogue / 34
  - type: textarea
    id: addons
    attributes:
      label: Other action bar or macro addons
      description: E.g. Bartender4, Dominos, a macro manager. "None" is a fine answer.
